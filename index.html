<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AutoPass B • DRPCIV Simulator</title>

  <style>
    :root {
      --bg-main: #060913;
      --surface: rgba(17, 24, 39, 0.75);
      --surface-border: rgba(255, 255, 255, 0.08);
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.35);
      --drpciv-orange: #d97706;
      --drpciv-orange-glow: rgba(217, 119, 6, 0.4);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    html, body {
      height: 100%;
      background: radial-gradient(circle at 50% 0%, #172554 0%, var(--bg-main) 75%);
      color: var(--text-main);
      overflow: hidden;
    }

    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      padding: 16px;
      position: relative;
    }
    .screen.active { display: flex; }

    /* Dashboard examen */
    .dashboard {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 8px 12px;
      border-radius: 14px;
      margin-bottom: 8px;
      border: 1px solid var(--surface-border);
      flex-shrink: 0;
      gap: 6px;
    }

    .stat-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 20px;
    }
    .pill-green { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.2); }
    .pill-red { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }
    
    /* Cronometru + Buton Pauză integrat */
    .timer-container {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.25);
      padding: 4px 10px 4px 12px;
      border-radius: 20px;
    }
    .pill-timer {
      color: #60a5fa;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      font-weight: 700;
    }
    .btn-pause-inline {
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: #fff;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-pause-inline:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.25);
    }

    .sub-dashboard {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      padding: 0 4px;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .progress-bar {
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      margin-bottom: 12px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      transition: width 0.3s ease;
    }

    .scroll-content {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 12px;
      transition: filter 0.3s ease;
    }

    /* Card întrebare */
    .card-question {
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 16px;
      border-radius: 16px;
      border: 1px solid var(--surface-border);
      margin-bottom: 12px;
    }
    .q-badge {
      display: inline-block;
      font-size: 11px;
      text-transform: uppercase;
      color: #60a5fa;
      font-weight: 800;
      background: rgba(59, 130, 246, 0.12);
      padding: 4px 8px;
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .q-text {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.45;
      color: #ffffff;
    }

    .q-image-container {
      margin-top: 12px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: none;
      background: #000;
      text-align: center;
    }
    .q-image {
      max-width: 100%;
      max-height: 200px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }

    .options-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .opt-card {
      background: rgba(30, 41, 59, 0.5);
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.4;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .opt-card:active {
      transform: scale(0.98);
    }
    .opt-card.selected {
      background: linear-gradient(135deg, #d97706, #b45309);
      border-color: #f59e0b;
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 4px 14px var(--drpciv-orange-glow);
    }
    .opt-tag {
      font-weight: 800;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 5px 9px;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .opt-card.selected .opt-tag {
      background: #ffffff;
      color: #92400e;
    }

    .expl-box {
      background: rgba(6, 78, 59, 0.5);
      border: 1px solid rgba(52, 211, 153, 0.3);
      backdrop-filter: blur(12px);
      border-radius: 14px;
      padding: 14px;
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.45;
      color: #a7f3d0;
      display: none;
    }

    .bottom-bar {
      padding-top: 8px;
      padding-bottom: env(safe-area-inset-bottom, 10px);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }
    .btn:active {
      transform: scale(0.98);
    }

    .btn-submit {
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(22, 163, 74, 0.35);
      font-size: 16px;
      padding: 15px;
    }

    .btn-clear {
      background: rgba(51, 65, 85, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
    }

    .btn-defer {
      background: rgba(30, 58, 138, 0.5);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #93c5fd;
    }

    .hero-title {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 40%, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    /* Container banner AdMob 50px */
    .admob-banner-container {
      width: 100%;
      min-height: 50px;
      max-height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(15, 23, 42, 0.5);
      border: 1px dashed rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      flex-shrink: 0;
      margin-top: auto;
    }

    .admob-placeholder {
      font-size: 11px;
      color: #64748b;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      font-weight: 700;
    }

    /* ECRAN PAUZĂ OVERLAY (BLUR 2026) */
    .pause-overlay {
      position: absolute;
      inset: 0;
      background: rgba(6, 9, 19, 0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      animation: fadeIn 0.2s ease;
    }
    .pause-overlay.active {
      display: flex;
    }
    .pause-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      padding: 24px;
      border-radius: 20px;
      max-width: 320px;
      width: 100%;
      box-shadow: 0 12px 36px rgba(0,0,0,0.4);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>

  <script src="questions.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>

  <!-- ECRAN 1: START -->
  <div id="startScreen" class="screen active" style="justify-content: space-between; text-align: center; padding: 24px 16px env(safe-area-inset-bottom, 16px);">
    <div style="margin: auto 0;">
      <div style="width: 60px; height: 60px; background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.3); border-radius: 18px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; box-shadow: 0 6px 20px var(--primary-glow);">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M5 11l2-6h10l2 6"/></svg>
      </div>
      <h1 class="hero-title">AutoPass B</h1>
      <p style="color: var(--text-muted); font-size: 14px; line-height: 1.5; margin-bottom: 28px;">Simulare 1 la 1 a examenului oficial DRPCIV / DGPCI.</p>
      <button class="btn btn-submit" id="btnStart" onclick="window.initTest && window.initTest()">Începe Chestionarul</button>
    </div>

    <div class="admob-banner-container" id="admob-start-slot">
      <span class="admob-placeholder">Spațiu Reclamă AdMob</span>
    </div>
  </div>

  <!-- ECRAN 2: EXAMEN ÎN DESFĂȘURARE -->
  <div id="quizScreen" class="screen">
    
    <!-- OVERLAY PAUZĂ -->
    <div id="pauseOverlay" class="pause-overlay" onclick="window.togglePause && window.togglePause()">
      <div class="pause-card" onclick="event.stopPropagation()">
        <div style="width: 52px; height: 52px; background: rgba(59,130,246,0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><rect x="9" y="9" width="2" height="6"/><rect x="13" y="9" width="2" height="6"/></svg>
        </div>
        <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 6px;">Examen în Pauză</h2>
        <p style="color: var(--text-muted); font-size: 13px; line-height: 1.45; margin-bottom: 20px;">Cronometrul este oprit, iar întrebarea este protejată.</p>
        <button class="btn btn-submit" onclick="window.togglePause && window.togglePause()">Reia Testul</button>
      </div>
    </div>

    <div class="dashboard">
      <div class="stat-pill pill-green">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
        <span id="lblCorrect">0</span>
      </div>
      <div class="stat-pill pill-red">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        <span id="lblWrong">0</span>/5
      </div>
      
      <!-- Cronometru + Buton Pauză -->
      <div class="timer-container">
        <span class="pill-timer" id="lblTimer">30:00</span>
        <button class="btn-pause-inline" id="btnPause" onclick="window.togglePause && window.togglePause()" title="Pauză / Reia">
          <svg id="iconPause" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
        </button>
      </div>
    </div>

    <div class="sub-dashboard">
      <span>Întrebări rămase: <strong id="lblRemaining" style="color: #f8fafc;">0</strong></span>
      <span>Amânate: <strong id="lblDeferredCount" style="color: #60a5fa;">0</strong></span>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="scroll-content" id="quizContent">
      <div class="card-question">
        <div class="q-badge">Întrebarea activă</div>
        <div class="q-text" id="lblQuestionText"></div>
        
        <div class="q-image-container" id="imgContainer">
          <img src="" id="qImage" class="q-image" alt="Situație rutieră">
        </div>
      </div>

      <div class="options-group" id="containerOptions"></div>
      <div id="boxExplanation" class="expl-box"></div>
    </div>

    <div class="bottom-bar">
      <div class="action-row" id="secondaryActions">
        <button class="btn btn-clear" id="btnClear" onclick="window.clearSelection && window.clearSelection()">Șterge răspunsul</button>
        <button class="btn btn-defer" id="btnDefer" onclick="window.deferQuestion && window.deferQuestion()">Răspunde mai târziu</button>
      </div>
      <button class="btn btn-submit" id="btnAction" onclick="window.validateCurrentAnswer && window.validateCurrentAnswer()">Trimite Răspunsul</button>
    </div>
  </div>

  <!-- ECRAN 3: REZULTAT FINAL -->
  <div id="endScreen" class="screen" style="justify-content: space-between; text-align: center; padding: 24px 16px env(safe-area-inset-bottom, 16px);">
    <div style="margin: auto 0;">
      <h1 id="endTitle" style="font-size: 32px; font-weight: 800; margin-bottom: 10px;"></h1>
      <p id="endSubtitle" style="color: var(--text-muted); font-size: 15px; margin-bottom: 28px;"></p>
      <button class="btn btn-submit" id="btnRestart" onclick="location.reload()">Reia Chestionarul</button>
    </div>

    <div class="admob-banner-container" id="admob-end-slot">
      <span class="admob-placeholder">Spațiu Reclamă AdMob</span>
    </div>
  </div>

</body>
</html>
