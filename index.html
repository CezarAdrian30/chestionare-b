<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AutoPass B • DRPCIV Simulator</title>

  <style>
    :root {
      --bg-main: #060913;
      --surface: rgba(17, 24, 39, 0.75);
      --surface-border: rgba(255, 255, 255, 0.08);
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.35);
      --drpciv-orange: #d97706;
      --drpciv-orange-glow: rgba(217, 119, 6, 0.4);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    html, body {
      height: 100%;
      background: radial-gradient(circle at 50% 0%, #172554 0%, var(--bg-main) 75%);
      color: var(--text-main);
      overflow: hidden;
    }

    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      padding: 16px;
    }
    .screen.active { display: flex; }

    /* Dashboard modern & oficial */
    .dashboard {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 10px 14px;
      border-radius: 14px;
      margin-bottom: 8px;
      border: 1px solid var(--surface-border);
      flex-shrink: 0;
    }

    .stat-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 20px;
    }
    .pill-green { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.2); }
    .pill-red { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }
    .pill-timer { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.2); font-variant-numeric: tabular-nums; }

    /* Sub-bară cu întrebări rămase */
    .sub-dashboard {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      padding: 0 4px;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    /* Bară progres */
    .progress-bar {
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      margin-bottom: 12px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      transition: width 0.3s ease;
    }

    /* Conținut cu scroll */
    .scroll-content {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 12px;
    }

    /* Card întrebare */
    .card-question {
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 16px;
      border-radius: 16px;
      border: 1px solid var(--surface-border);
      margin-bottom: 12px;
    }
    .q-badge {
      display: inline-block;
      font-size: 11px;
      text-transform: uppercase;
      color: #60a5fa;
      font-weight: 800;
      background: rgba(59, 130, 246, 0.12);
      padding: 4px 8px;
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .q-text {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.45;
      color: #ffffff;
    }

    /* Caseta imaginii */
    .q-image-container {
      margin-top: 12px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: none;
      background: #000;
      text-align: center;
    }
    .q-image {
      max-width: 100%;
      max-height: 200px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }

    /* Opțiuni A, B, C */
    .options-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .opt-card {
      background: rgba(30, 41, 59, 0.5);
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.4;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .opt-card:active {
      transform: scale(0.98);
    }
    /* Stil selectat inspirat de monitorul DRPCIV (Portocaliu aprins) */
    .opt-card.selected {
      background: linear-gradient(135deg, #d97706, #b45309);
      border-color: #f59e0b;
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 4px 14px var(--drpciv-orange-glow);
    }
    .opt-tag {
      font-weight: 800;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 5px 9px;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .opt-card.selected .opt-tag {
      background: #ffffff;
      color: #92400e;
    }

    /* Explicație oficială */
    .expl-box {
      background: rgba(6, 78, 59, 0.5);
      border: 1px solid rgba(52, 211, 153, 0.3);
      backdrop-filter: blur(12px);
      border-radius: 14px;
      padding: 14px;
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.45;
      color: #a7f3d0;
      display: none;
    }

    /* Zona butoanelor de acțiune */
    .bottom-bar {
      padding-top: 8px;
      padding-bottom: env(safe-area-inset-bottom, 10px);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }
    .btn:active {
      transform: scale(0.98);
    }

    /* Butonul principal verde ca la examen */
    .btn-submit {
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(22, 163, 74, 0.35);
      font-size: 16px;
      padding: 15px;
    }

    /* Butonul Șterge răspunsul */
    .btn-clear {
      background: rgba(51, 65, 85, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
    }

    /* Butonul Răspunde mai târziu */
    .btn-defer {
      background: rgba(30, 58, 138, 0.5);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #93c5fd;
    }

    .hero-title {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 40%, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <!-- ECRAN 1: START -->
  <div id="startScreen" class="screen active" style="justify-content: center; text-align: center; padding: 24px;">
    <div style="width: 60px; height: 60px; background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.3); border-radius: 18px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; box-shadow: 0 6px 20px var(--primary-glow);">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M5 11l2-6h10l2 6"/></svg>
    </div>
    <h1 class="hero-title">AutoPass B</h1>
    <p style="color: var(--text-muted); font-size: 14px; line-height: 1.5; margin-bottom: 28px;">Simulare 1 la 1 a examenului oficial DRPCIV / DGPCI.</p>
    <button class="btn btn-submit" id="btnStart">Începe Chestionarul</button>
  </div>

  <!-- ECRAN 2: EXAMEN ÎN DESFĂȘURARE -->
  <div id="quizScreen" class="screen">
    <div class="dashboard">
      <div class="stat-pill pill-green">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
        <span id="lblCorrect">0</span>
      </div>
      <div class="stat-pill pill-red">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        <span id="lblWrong">0</span>/5
      </div>
      <div class="stat-pill pill-timer" id="lblTimer">30:00</div>
    </div>

    <div class="sub-dashboard">
      <span>Întrebări rămase: <strong id="lblRemaining" style="color: #f8fafc;">26</strong></span>
      <span>Amânate: <strong id="lblDeferredCount" style="color: #60a5fa;">0</strong></span>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="scroll-content">
      <div class="card-question">
        <div class="q-badge">Întrebarea activă</div>
        <div class="q-text" id="lblQuestionText"></div>
        
        <div class="q-image-container" id="imgContainer">
          <img src="" id="qImage" class="q-image" alt="Situație rutieră">
        </div>
      </div>

      <div class="options-group" id="containerOptions"></div>
      <div id="boxExplanation" class="expl-box"></div>
    </div>

    <!-- Bara butoanelor -->
    <div class="bottom-bar">
      <div class="action-row" id="secondaryActions">
        <button class="btn btn-clear" id="btnClear" onclick="clearSelection()">Șterge răspunsul</button>
        <button class="btn btn-defer" id="btnDefer" onclick="deferQuestion()">Răspunde mai târziu</button>
      </div>
      <button class="btn btn-submit" id="btnAction" onclick="validateCurrentAnswer()">Trimite Răspunsul</button>
    </div>
  </div>

  <!-- ECRAN 3: REZULTAT FINAL -->
  <div id="endScreen" class="screen" style="justify-content: center; text-align: center; padding: 24px;">
    <h1 id="endTitle" style="font-size: 32px; font-weight: 800; margin-bottom: 10px;"></h1>
    <p id="endSubtitle" style="color: var(--text-muted); font-size: 15px; margin-bottom: 28px;"></p>
    <button class="btn btn-submit" id="btnRestart">Reia Chestionarul</button>
  </div>

  <!-- ÎNCĂRCAREA BAZEI DE DATE EXTERNE -->
  <script src="questions.js"></script>

  <!-- LOGICA APLICAȚIEI -->
  <script>
    let activeQuestions = [];
    let initialTotal = 26;
    let correctCount = 0;
    let wrongCount = 0;
    let deferredCount = 0;
    let userSelections = new Set();
    let secondsLeft = 30 * 60;
    let timerRef = null;

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function initTest() {
      let source = window.questionsData || window.localDatabase;

      if (!source || !Array.isArray(source) || source.length === 0) {
        alert("Eroare: Baza de date questions.js nu a fost găsită!");
        return;
      }

      // Amestecăm și selectăm 26 de întrebări (sau câte sunt)
      activeQuestions = shuffleArray(source).slice(0, 26);
      initialTotal = activeQuestions.length;

      correctCount = 0;
      wrongCount = 0;
      deferredCount = 0;
      secondsLeft = 30 * 60;

      document.getElementById('lblCorrect').textContent = '0';
      document.getElementById('lblWrong').textContent = '0';
      updateCounters();

      document.getElementById('startScreen').classList.remove('active');
      document.getElementById('quizScreen').classList.add('active');
      
      renderQuestion();
      if (timerRef) clearInterval(timerRef);
      timerRef = setInterval(updateTimer, 1000);
    }

    function updateCounters() {
      document.getElementById('lblRemaining').textContent = activeQuestions.length;
      document.getElementById('lblDeferredCount').textContent = deferredCount;
      const completed = initialTotal - activeQuestions.length;
      const progress = (completed / initialTotal) * 100;
      document.getElementById('progressFill').style.width = `${progress}%`;
    }

    function updateTimer() {
      secondsLeft--;
      const min = Math.floor(secondsLeft / 60);
      const sec = secondsLeft % 60;
      document.getElementById('lblTimer').textContent = `${min}:${sec < 10 ? '0' : ''}${sec}`;
      if (secondsLeft <= 0) finalize(false, "Timpul de 30 de minute a expirat.");
    }

    function renderQuestion() {
      userSelections.clear();
      document.getElementById('boxExplanation').style.display = 'none';
      document.getElementById('secondaryActions').style.display = 'grid';

      const btn = document.getElementById('btnAction');
      btn.textContent = "Trimite Răspunsul";
      btn.onclick = validateCurrentAnswer;

      const q = activeQuestions[0]; // Întotdeauna luăm prima întrebare din coada activă
      document.getElementById('lblQuestionText').textContent = q.question;

      // Gestionare imagine
      const imgContainer = document.getElementById('imgContainer');
      const qImage = document.getElementById('qImage');
      if (q.image) {
        qImage.src = q.image;
        imgContainer.style.display = 'block';
      } else {
        imgContainer.style.display = 'none';
        qImage.src = '';
      }

      const container = document.getElementById('containerOptions');
      container.innerHTML = '';

      q.options.forEach(opt => {
        const item = document.createElement('div');
        item.className = 'opt-card';
        item.id = `opt-${opt.id}`;
        item.innerHTML = `<span class="opt-tag">${opt.id}</span><span>${opt.text}</span>`;
        item.onclick = () => {
          if (userSelections.has(opt.id)) {
            userSelections.delete(opt.id);
            item.classList.remove('selected');
          } else {
            userSelections.add(opt.id);
            item.classList.add('selected');
          }
        };
        container.appendChild(item);
      });

      updateCounters();
    }

    // Funcția 1: ȘTERGE RĂSPUNSUL (resetează selecțiile)
    function clearSelection() {
      userSelections.clear();
      document.querySelectorAll('.opt-card').forEach(el => el.classList.remove('selected'));
    }

    // Funcția 2: RĂSPUNDE MAI TÂRZIU (amână la finalul listei)
    function deferQuestion() {
      if (activeQuestions.length <= 1) {
        alert("Aceasta este ultima întrebare rămasă din chestionar!");
        return;
      }
      // Mută prima întrebare la sfârșitul cozii
      const deferred = activeQuestions.shift();
      activeQuestions.push(deferred);
      deferredCount++;
      renderQuestion();
    }

    function validateCurrentAnswer() {
      const q = activeQuestions[0];
      const selectedArr = Array.from(userSelections).sort();
      const correctArr = [...q.correct].sort();

      const isMatch = JSON.stringify(selectedArr) === JSON.stringify(correctArr);

      if (isMatch) {
        correctCount++;
        document.getElementById('lblCorrect').textContent = correctCount;
        advance();
      } else {
        wrongCount++;
        document.getElementById('lblWrong').textContent = wrongCount;

        // Ascundem butoanele secundare în caz de greșeală
        document.getElementById('secondaryActions').style.display = 'none';

        const box = document.getElementById('boxExplanation');
        box.style.display = 'block';
        box.innerHTML = `<strong>Răspuns incorect!</strong> Variante corecte: <b>${correctArr.join(', ')}</b><br><br>${q.article}`;

        if (wrongCount >= 5) {
          finalize(false, "Ai acumulat 5 răspunsuri greșite. Examen picat.");
          return;
        }

        const btn = document.
