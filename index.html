<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AutoPass B • 2026</title>

  <style>
    :root {
      --bg-main: #060913;
      --surface: rgba(17, 24, 39, 0.75);
      --surface-border: rgba(255, 255, 255, 0.08);
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    html, body {
      height: 100%;
      background: radial-gradient(circle at 50% 0%, #172554 0%, var(--bg-main) 75%);
      color: var(--text-main);
      overflow: hidden;
    }

    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      padding: 16px;
    }
    .screen.active { display: flex; }

    /* Dashboard modern */
    .dashboard {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 10px 14px;
      border-radius: 14px;
      margin-bottom: 10px;
      border: 1px solid var(--surface-border);
      flex-shrink: 0;
    }

    .stat-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 20px;
    }
    .pill-green { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.2); }
    .pill-red { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }
    .pill-timer { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.2); font-variant-numeric: tabular-nums; }

    /* Bară progres */
    .progress-bar {
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      margin-bottom: 12px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      transition: width 0.3s ease;
    }

    /* Conținut cu scroll */
    .scroll-content {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 12px;
    }

    /* Card întrebare */
    .card-question {
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 16px;
      border-radius: 16px;
      border: 1px solid var(--surface-border);
      margin-bottom: 12px;
    }
    .q-badge {
      display: inline-block;
      font-size: 11px;
      text-transform: uppercase;
      color: #60a5fa;
      font-weight: 800;
      background: rgba(59, 130, 246, 0.12);
      padding: 4px 8px;
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .q-text {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.45;
      color: #ffffff;
    }

    /* Imagine */
    .q-image-container {
      margin-top: 12px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: none;
      background: #000;
      text-align: center;
    }
    .q-image {
      max-width: 100%;
      max-height: 200px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }

    /* Opțiuni */
    .options-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .opt-card {
      background: rgba(30, 41, 59, 0.5);
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.4;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .opt-card:active {
      transform: scale(0.98);
    }
    .opt-card.selected {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.85), rgba(29, 78, 216, 0.95));
      border-color: #60a5fa;
      color: #ffffff;
      box-shadow: 0 4px 14px var(--primary-glow);
    }
    .opt-tag {
      font-weight: 800;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 5px 9px;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .opt-card.selected .opt-tag {
      background: #ffffff;
      color: #1d4ed8;
    }

    /* Explicație */
    .expl-box {
      background: rgba(6, 78, 59, 0.5);
      border: 1px solid rgba(52, 211, 153, 0.3);
      backdrop-filter: blur(12px);
      border-radius: 14px;
      padding: 14px;
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.45;
      color: #a7f3d0;
      display: none;
    }

    /* Buton fixat jos */
    .bottom-bar {
      padding-top: 8px;
      padding-bottom: env(safe-area-inset-bottom, 10px);
      flex-shrink: 0;
    }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }
    .btn-submit {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      box-shadow: 0 6px 20px var(--primary-glow);
    }
    .btn-submit:active {
      transform: scale(0.98);
    }

    .hero-title {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 40%, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <!-- ECRAN 1: START -->
  <div id="startScreen" class="screen active" style="justify-content: center; text-align: center; padding: 24px;">
    <div style="width: 60px; height: 60px; background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.3); border-radius: 18px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; box-shadow: 0 6px 20px var(--primary-glow);">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M5 11l2-6h10l2 6"/></svg>
    </div>
    <h1 class="hero-title">AutoPass B</h1>
    <p style="color: var(--text-muted); font-size: 14px; line-height: 1.5; margin-bottom: 28px;">Simulator examen oficial DRPCIV / DGPCI cu întrebări și imagini rutiere.</p>
    <button class="btn btn-submit" id="btnStart">Începe Chestionarul</button>
  </div>

  <!-- ECRAN 2: EXAMEN ÎN DESFĂȘURARE -->
  <div id="quizScreen" class="screen">
    <div class="dashboard">
      <div class="stat-pill pill-green">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
        <span id="lblCorrect">0</span>
      </div>
      <div class="stat-pill pill-red">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        <span id="lblWrong">0</span>/5
      </div>
      <div class="stat-pill pill-timer" id="lblTimer">30:00</div>
    </div>
