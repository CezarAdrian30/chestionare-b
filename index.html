<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chestionare B Offline</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    html, body {
      height: 100%;
      background-color: #0b1329;
      color: #f8fafc;
      overflow: hidden;
    }

    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      padding: 14px;
    }
    .screen.active { display: flex; }

    /* Panou de bord */
    .dashboard {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 10px;
      border: 1px solid #334155;
      flex-shrink: 0;
    }
    .stat { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 8px; }
    .stat-green { background: #064e3b; color: #34d399; }
    .stat-red { background: #7f1d1d; color: #f87171; }
    .stat-timer { background: #1e3a8a; color: #60a5fa; font-variant-numeric: tabular-nums; }

    /* Zonă cu scroll pentru întrebare și variante */
    .scroll-content {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 12px;
    }

    /* Caseta întrebării */
    .card-question {
      background: #1e293b;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-bottom: 12px;
    }
    .q-number { font-size: 11px; text-transform: uppercase; color: #94a3b8; font-weight: 700; }
    .q-text { font-size: 15px; font-weight: 600; line-height: 1.4; color: #f1f5f9; margin-top: 6px; }

    /* Imaginea întrebării */
    .q-image-container {
      margin-top: 10px;
      border-radius: 8px;
      overflow: hidden;
      background: #0f172a;
      display: none;
      text-align: center;
    }
    .q-image {
      max-width: 100%;
      max-height: 200px;
      object-fit: contain;
      border-radius: 8px;
    }

    /* Opțiuni */
    .options-group { display: flex; flex-direction: column; gap: 10px; }
    .opt-card {
      background: #172554;
      border: 2px solid #1e3a8a;
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      line-height: 1.35;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .opt-card.selected { background: #1d4ed8; border-color: #60a5fa; color: #fff; font-weight: 500; }
    .opt-tag { font-weight: 800; font-size: 13px; background: rgba(255,255,255,0.12); padding: 5px 9px; border-radius: 6px; flex-shrink: 0; }

    /* Explicație legislație */
    .expl-box {
      background: #022c22;
      border: 1px solid #059669;
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
      font-size: 13px;
      line-height: 1.4;
      color: #a7f3d0;
      display: none;
    }
